name: Deploy CodeAtlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set the correct repository path and site URL
        shell: bash
        env:
          # Optional: add a repository variable named SITE_URL (Settings -> Secrets and variables -> Actions -> Variables)
          # with your custom domain, for example https://codeatlas.com. Leave it unset to use GitHub Pages.
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          OWNER_LOWER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [[ -n "$CUSTOM_SITE_URL" ]]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=${CUSTOM_SITE_URL%/}" >> "$GITHUB_ENV"
          elif [[ "$REPOSITORY_NAME" == "$OWNER.github.io" ]]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER_LOWER.github.io" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPOSITORY_NAME" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER_LOWER.github.io" >> "$GITHUB_ENV"
          fi

      - name: Build static website
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
